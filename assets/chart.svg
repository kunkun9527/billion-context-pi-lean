<svg xmlns="http://www.w3.org/2000/svg" width="800" height="220" viewBox="0 0 800 220" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .fg{fill:#1f2328}.mu{fill:#59636e}.up{fill:#d0d7de}.ac{fill:#1a7f37}
    @media (prefers-color-scheme: dark){.fg{fill:#e6edf3}.mu{fill:#9198a1}.up{fill:#3d444d}.ac{fill:#3fb950}}
    .num{font-variant-numeric:tabular-nums}
  </style>
  <text x="24" y="34" class="mu" font-size="14">Always-on context vs. upstream billion-context-pi@0.1.83</text>
  <text x="24" y="86" class="ac" font-size="48" font-weight="700">−94.2%</text>
  <text x="222" y="70" class="fg num" font-size="18" font-weight="600">8,670 → 503 tokens</text>
  <text x="222" y="92" class="mu" font-size="14">8,167 fewer tokens per request, same features</text>
  <g font-size="13">
    <text x="24" y="138" class="mu">Pinned upstream</text>
    <rect x="142" y="124" width="548" height="18" class="up"/><text x="698" y="138" class="mu num">8,670</text>
    <text x="24" y="172" class="fg" font-weight="600">Lean</text>
    <rect x="142" y="158" width="31.8" height="18" class="ac"/><text x="181.8" y="172" class="fg num" font-weight="600">503</text>
  </g>
  <text x="24" y="208" class="mu" font-size="11">Tokens estimated as ceil(chars / 4).</text>
</svg>
